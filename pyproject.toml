[project]
name = "catalog-image-index"
version = "0.1.0"
description = "A local multimodal index of every product photo: wrong photos, non-photos and duplicates found automatically, plus text search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sentence-transformers>=5",
  "transformers>=5",
  "torch>=2.5",
  "torchvision",
  "pillow>=11",
  "numpy",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
