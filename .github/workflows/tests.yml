name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The model is not needed for the offline tests, so torch is not installed here.
      - run: uv run --no-project --python 3.12 --with numpy --with pillow --with pytest pytest -q
